<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bean Route | 街の一杯を、たどる。</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#333333",
              sub: "#A5A5A5",
              paper: "#FAFAFA",
              brand: "#C77B4A",
            },
            fontFamily: { sans: ['"Noto Sans JP"', "sans-serif"] },
            maxWidth: { content: "1120px" },
          },
        },
      };
    </script>
  </head>
  <body class="pt-16 font-sans text-ink">
    <!-- ヘッダー -->
    <header class="fixed left-0 top-0 z-50 h-16 w-full bg-white shadow-sm">
      <div
        class="mx-auto flex h-full max-w-content items-center justify-between px-5"
      >
        <a href="#" class="text-xl font-bold tracking-wide">
          Bean<span class="text-brand">Route</span>
        </a>
        <nav class="hidden md:block">
          <ul class="flex items-center gap-6 text-sm font-medium">
            <li><a href="#cafe" class="hover:text-brand">カフェを探す</a></li>
            <li><a href="#about" class="hover:text-brand">このサイトについて</a></li>
            <li><a href="#contact" class="hover:text-brand">お問い合わせ</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- メインビジュアル -->
    <section
      class="flex h-[400px] items-center justify-center bg-cover bg-center text-center"
      style="background-image: url('./images/hero.jpg')"
    >
      <div class="px-5">
        <h1 class="text-3xl font-bold text-white md:text-4xl">Bean Route</h1>
        <p class="mt-4 text-sm text-white md:text-base">
          自家焙煎からスペシャルティまで、いま行きたい9軒
        </p>
      </div>
    </section>

    <!-- カフェ一覧 -->
    <section id="cafe" class="bg-paper py-16 md:py-20">
      <div class="mx-auto max-w-content px-5">
        <h2 class="text-center text-2xl font-bold md:text-3xl">CAFE LIST</h2>
        <p class="mt-2 text-center text-sm text-sub">今週のおすすめを一覧で</p>

        <ul
          id="cafe-tabs"
          class="mt-8 flex flex-wrap justify-center gap-2 md:gap-3"
        >
          <li>
            <button
              type="button"
              data-category="all"
              class="rounded-full border border-sub px-5 py-2 text-sm hover:border-brand hover:text-brand"
            >
              すべて
            </button>
          </li>
          <li>
            <button
              type="button"
              data-category="specialty"
              class="rounded-full border border-sub px-5 py-2 text-sm hover:border-brand hover:text-brand"
            >
              スペシャルティ
            </button>
          </li>
          <li>
            <button
              type="button"
              data-category="roast"
              class="rounded-full border border-sub px-5 py-2 text-sm hover:border-brand hover:text-brand"
            >
              自家焙煎
            </button>
          </li>
          <li>
            <button
              type="button"
              data-category="sweets"
              class="rounded-full border border-sub px-5 py-2 text-sm hover:border-brand hover:text-brand"
            >
              スイーツ自慢
            </button>
          </li>
        </ul>

        <ul
          id="cafe-list"
          class="mt-10 grid grid-cols-1 gap-6 md:grid-cols-3 md:gap-8"
        ></ul>
      </div>
    </section>

    <!-- このサイトについて -->
    <section id="about" class="py-16 md:py-20">
      <div class="mx-auto max-w-content px-5 text-center">
        <h2 class="text-2xl font-bold md:text-3xl">ABOUT</h2>
        <p class="mx-auto mt-6 max-w-2xl text-sm leading-8 md:text-base">
          Bean Route は、豆の産地や焙煎の考え方まで書いてあるお店だけを集めた、
          ちいさなカフェ紹介サイトです。掲載は編集部が実際に足を運んだ店に限っています。
        </p>
      </div>
    </section>

    <!-- お問い合わせ -->
    <section id="contact" class="bg-paper py-16 md:py-20">
      <div class="mx-auto max-w-content px-5">
        <h2 class="text-center text-2xl font-bold md:text-3xl">CONTACT</h2>
        <p class="mt-2 text-center text-sm text-sub">
          掲載のご相談・お問い合わせはこちらから
        </p>

        <form id="contact-form" class="mx-auto mt-10 max-w-xl">
          <div class="mb-6">
            <label for="name" class="mb-2 block text-sm font-medium">
              お名前
            </label>
            <input
              type="text"
              id="name"
              name="name"
              class="w-full rounded border border-sub bg-white px-4 py-3 text-sm outline-none focus:border-brand"
              placeholder="POSSE 太郎"
            />
            <p id="name-error" class="mt-2 text-sm text-red-600"></p>
          </div>

          <div class="mb-6">
            <label for="email" class="mb-2 block text-sm font-medium">
              メールアドレス
            </label>
            <input
              type="email"
              id="email"
              name="email"
              class="w-full rounded border border-sub bg-white px-4 py-3 text-sm outline-none focus:border-brand"
              placeholder="taro@example.com"
            />
          </div>

          <div class="mb-6">
            <label for="category" class="mb-2 block text-sm font-medium">
              ご用件
            </label>
            <select
              id="category"
              name="category"
              class="w-full rounded border border-sub bg-white px-4 py-3 text-sm outline-none focus:border-brand"
            >
              <option value="掲載の相談">掲載の相談</option>
              <option value="内容の修正">内容の修正</option>
              <option value="その他">その他</option>
            </select>
          </div>

          <div class="mb-8">
            <label for="message" class="mb-2 block text-sm font-medium">
              お問い合わせ内容
            </label>
            <textarea
              id="message"
              name="message"
              rows="5"
              class="w-full rounded border border-sub bg-white px-4 py-3 text-sm outline-none focus:border-brand"
              placeholder="ご自由にお書きください"
            ></textarea>
          </div>

          <button
            type="submit"
            class="w-full rounded-full bg-brand px-8 py-4 text-sm font-bold text-white hover:opacity-80 md:w-auto"
          >
            送信する
          </button>
        </form>
      </div>
    </section>

    <!-- フッター -->
    <footer class="bg-ink py-10 text-center text-white">
      <p class="text-lg font-bold">Bean<span class="text-brand">Route</span></p>
      <p class="mt-3 text-xs text-sub">© 2026 Bean Route</p>
    </footer>

    <script src="./script_sample.js" defer></script>
  </body>
</html>
